services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cra_password}
      POSTGRES_DB: ${POSTGRES_DB:-cra_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cra_user} -d ${POSTGRES_DB:-cra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - devtools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cra_user}:${POSTGRES_PASSWORD:-cra_password}@postgres:5432/${POSTGRES_DB:-cra_db}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      FERNET_KEY: ${FERNET_KEY:-vTosH7sIs-84I_kHddd4UmBPH1w8ixmTRjPie3KiEbs=}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-local-webhook-secret}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "python scripts/migrate.py && python -m backend.run"

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
      VITE_DEV_WS_PROXY_TARGET: ws://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cra_user}:${POSTGRES_PASSWORD:-cra_password}@postgres:5432/${POSTGRES_DB:-cra_db}
      APP_ENV: test
      AUTH_REQUIRE_EMAIL_VERIFICATION: "true"
      FERNET_KEY: ""
      JWT_SECRET: test-secret
      GITHUB_WEBHOOK_SECRET: ""
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "python scripts/migrate.py && pytest backend/tests/ -v"
    profiles:
      - test

volumes:
  postgres_data:
  frontend_node_modules:
